# Nacos Docker Compose
# Standalone mode with embedded storage
# Version: 3.2.4
# Usage: docker-compose up -d

services:
  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: nacos-server
    restart: always
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: ""
      JVM_XMS: ${JVM_XMS:-512m}
      JVM_XMX: ${JVM_XMX:-512m}
      JVM_XMN: ${JVM_XMN:-256m}
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN in .env}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?Set NACOS_AUTH_IDENTITY_VALUE in .env}
      TZ: Asia/Shanghai
    volumes:
      - ./nacos/logs:/home/nacos/logs
      - ./nacos/data:/home/nacos/data
    ports:
      - "${NACOS_BIND_ADDRESS:-127.0.0.1}:${NACOS_CONSOLE_PORT:-8080}:8080"
      - "${NACOS_BIND_ADDRESS:-127.0.0.1}:${NACOS_HTTP_PORT:-8848}:8848"
      - "${NACOS_BIND_ADDRESS:-127.0.0.1}:${NACOS_GRPC_PORT:-9848}:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v3/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - nacos-network

networks:
  nacos-network:
    driver: bridge
