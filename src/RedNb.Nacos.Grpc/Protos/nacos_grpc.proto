syntax = "proto3";

import "google/protobuf/any.proto";

// This file mirrors `api/src/main/proto/nacos_grpc_service.proto` of Nacos 3.2.4
// exactly (messages, field numbers and service/method names). Two details are
// load-bearing and were verified against the live server:
//
//   * NO `package` directive. Nacos registers its gRPC services under the bare
//     names `Request` and `BiRequestStream` — the full method names on the wire
//     are `Request/request` and `BiRequestStream/requestBiStream`. Adding a
//     package would prefix them and the server answers UNIMPLEMENTED
//     "Method not found".
//   * `Payload.body` is a `google.protobuf.Any` at field 3 and `Payload.metadata`
//     is at field 2 (Metadata: type = 3, clientIp = 8, headers = 7). A payload
//     with mismatched field numbers is decoded by the server as an empty type
//     and dropped ("Unknown payload type: ").

option csharp_namespace = "RedNb.Nacos.GrpcClient.Protos";

// The metadata.
message Metadata {
  // The request type name, e.g. ConfigQueryRequest.
  string type = 3;
  // The client IP.
  string clientIp = 8;
  // The headers.
  map<string, string> headers = 7;
}

// The common payload.
message Payload {
  // The metadata.
  Metadata metadata = 2;
  // The body, whose value holds the JSON serialization of the request.
  google.protobuf.Any body = 3;
}

// Bi-directional streaming service. The stream carries exactly two kinds of
// payload:
//   * the client's ConnectionSetupRequest — the only payload that registers the
//     connection server-side, answered with a SetupAckRequest push; and
//   * the client's push acknowledgements (Payload whose type is a *Response).
// Business requests must NOT ride this stream: the server's acceptor drops any
// other type with "unknown payload receive" (server side:
// GrpcBiStreamRequestAcceptor).
service BiRequestStream {
  // Bi-directional streaming RPC
  rpc requestBiStream(stream Payload) returns (stream Payload);
}

// The unary service `Request/request` carries every client-to-server request —
// ServerCheck, config and naming CRUD, health checks. It is declared manually in
// NacosGrpcClient: Grpc.Tools emits an uncompilable stub for it because the
// generated blocking overload keeps the proto method name verbatim, producing
// `Payload request(Payload request, ...)` whose body `request(request, options)`
// does not resolve (CS0149).
