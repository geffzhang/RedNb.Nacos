name: Start isolated Nacos 3.2.4
description: Authenticated standalone server for SDK validation
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        docker run -d --name rednb-nacos-ci \
          -e MODE=standalone -e NACOS_AUTH_ENABLE=true \
          -e NACOS_AUTH_ADMIN_ENABLE=true -e NACOS_AUTH_CONSOLE_ENABLE=true \
          -e NACOS_AUTH_TOKEN="$(openssl rand -base64 48 | tr -d '\n')" \
          -e NACOS_AUTH_IDENTITY_KEY=ci -e NACOS_AUTH_IDENTITY_VALUE="$(openssl rand -hex 24)" \
          -p 127.0.0.1:8080:8080 -p 127.0.0.1:8848:8848 -p 127.0.0.1:9848:9848 \
          nacos/nacos-server:v3.2.4
    - if: runner.os == 'Windows'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force artifacts/server | Out-Null
        Invoke-WebRequest https://github.com/alibaba/nacos/releases/download/3.2.4/nacos-server-3.2.4.zip -OutFile artifacts/server/nacos.zip
        Expand-Archive artifacts/server/nacos.zip artifacts/server
        $homePath = (Resolve-Path artifacts/server/nacos).Path
        $token = [Convert]::ToBase64String([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(48))
        Add-Content "$homePath/conf/application.properties" @"
        nacos.core.auth.enabled=true
        nacos.core.auth.admin.enabled=true
        nacos.core.auth.console.enabled=true
        nacos.core.auth.plugin.nacos.token.secret.key=$token
        nacos.core.auth.server.identity.key=ci
        nacos.core.auth.server.identity.value=$([Guid]::NewGuid().ToString('N'))
        "@
        Start-Process java -WindowStyle Hidden -WorkingDirectory $homePath -ArgumentList @(
          '-Xms512m', '-Xmx1g', '-Dnacos.standalone=true', "-Dnacos.home=$homePath",
          '-jar', 'target/nacos-server.jar', '--spring.config.additional-location=file:./conf/'
        ) -RedirectStandardOutput "$homePath/stdout.log" -RedirectStandardError "$homePath/stderr.log" | Out-Null
    - shell: pwsh
      run: |
        $ready = $false
        for ($i = 0; $i -lt 90; $i++) {
          try { Invoke-WebRequest http://localhost:8080/v3/console/health/readiness -TimeoutSec 2 | Out-Null; $ready = $true; break }
          catch { Start-Sleep -Seconds 2 }
        }
        if (!$ready) { throw 'Nacos readiness timeout' }
        Invoke-RestMethod -Method Post http://localhost:8848/nacos/v3/auth/user/admin -Body @{password='nacos'} | Out-Null
